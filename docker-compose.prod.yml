# ─────────────────────────────────────────────────────────────
# 운영 구성 — Lightsail 인스턴스 한 대에 앱 + DB + 리버스 프록시를 올린다.
#
# 로컬 개발용 docker-compose.yml과 별개다. 그쪽은 postgres·minio만 띄우고
# 앱은 호스트에서 `bun run dev`로 돌린다.
#
# 실행:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# ⚠️ .env.production 은 저장소에 커밋하지 않는다(.gitignore). 서버에만 둔다.
# ─────────────────────────────────────────────────────────────
services:
  app:
    # GitHub Actions가 빌드해 올린 이미지를 받아 쓴다.
    # 인스턴스에서 직접 빌드하지 않는 이유 — Next 빌드는 메모리를 많이 써서
    # 1~2GB 인스턴스에서는 OOM으로 죽거나 서비스 중인 앱을 밀어낸다.
    image: "${APP_IMAGE:?APP_IMAGE 를 지정하세요. 예 ghcr.io/<org>/sullyuwha:latest}"
    container_name: sullyuwha-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # DB는 같은 compose 네트워크 안에 있다. 호스트 포트로 나가지 않는다.
      DATABASE_URL: "postgresql://sullyuwha:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 지정하세요}@postgres:5432/sullyuwha"
    depends_on:
      postgres:
        condition: service_healthy
    # 외부에 직접 열지 않는다 — caddy만 이 포트로 붙는다.
    expose:
      - "5001"
    healthcheck:
      # 정적 페이지 하나를 친다. DB가 잠깐 흔들려도 앱 자체는 살아 있음을 본다.
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:5001/sull-admin/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: sullyuwha-db
    restart: unless-stopped
    # 포트를 호스트에 열지 않는다. 인터넷은 물론 호스트에서도 직접 붙지 않는다.
    # 필요하면 `docker compose exec postgres psql -U sullyuwha` 로 들어간다.
    environment:
      POSTGRES_USER: sullyuwha
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 지정하세요}"
      POSTGRES_DB: sullyuwha
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sullyuwha"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    # TLS 인증서를 자동으로 받고 갱신한다(Let's Encrypt).
    # Lightsail 로드밸런서는 월 $18이라 인스턴스보다 비싸다 — 같은 일을 여기서 한다.
    image: caddy:2-alpine
    container_name: sullyuwha-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 인증서 발급 도메인. DNS의 A 레코드가 이 인스턴스를 가리켜야 한다.
      # 서비스하는 모든 호스트를 쉼표로 나열한다(리다이렉트만 하는 것도 인증서가 필요하다).
      DOMAIN: "${DOMAIN:?DOMAIN 을 지정하세요. 예 sullyuwha.com}"
      # 실제로 앱을 서빙할 하나의 호스트. 나머지는 여기로 301 리다이렉트된다.
      # `:-` 라서 값이 비어 있어도 기본값이 들어간다 — 빈 문자열이 넘어가면
      # Caddy의 host 매처가 비어 설정 자체가 뜨지 않는다.
      CANONICAL_HOST: "${CANONICAL_HOST:-sullyuwha.co.kr}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
