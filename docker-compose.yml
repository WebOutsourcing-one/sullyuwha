services:
  postgres:
    image: postgres:16-alpine
    container_name: sullyuwha-db
    restart: unless-stopped
    ports:
      # 루프백에만 바인딩한다. "5432:5432"로 두면 0.0.0.0에 열려
      # 같은 네트워크(카페 wifi 등)의 누구나 약한 개발용 비밀번호로 접속할 수 있다.
      #
      # 호스트 포트는 바꿀 수 있게 열어둔다 — 다른 프로젝트의 postgres가 이미
      # 5432를 쓰고 있으면 컨테이너가 뜨지 않는다. 그럴 때 POSTGRES_PORT=5433 처럼
      # 지정하고 DATABASE_URL의 포트도 같이 바꾸면 된다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: sullyuwha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sullyuwha_local}
      POSTGRES_DB: sullyuwha
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sullyuwha"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sullyuwha-storage
    restart: unless-stopped
    ports:
      # 콘솔(9001)과 API(9000) 모두 루프백에만 노출한다.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_local}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO bucket init (runs once after minio is healthy)
  minio-init:
    image: minio/mc:latest
    container_name: sullyuwha-storage-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_local}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb local/sullyuwha-assets --ignore-existing &&
      echo 'MinIO bucket ready'
      "

volumes:
  pgdata:
  minio_data:
