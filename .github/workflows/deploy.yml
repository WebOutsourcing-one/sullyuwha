# main에 올라가면 이미지를 빌드해 GHCR에 올리고, Lightsail 인스턴스에서 교체한다.
#
# 인스턴스에서 직접 빌드하지 않는 이유 — Next 빌드는 메모리를 많이 써서
# 1~2GB 인스턴스에서는 OOM으로 죽거나 서비스 중인 앱을 밀어낸다.
#
# 최초 세팅(시크릿·서버 준비)은 docs/deploy.md 참고.
name: Deploy

on:
  push:
    branches: [main]
  # 같은 커밋을 다시 배포하거나 롤백할 때 수동으로 돌린다.
  workflow_dispatch:
    inputs:
      ref:
        description: "배포할 커밋/태그 (비우면 현재 브랜치)"
        required: false

concurrency:
  # 배포가 겹치면 컨테이너 교체가 뒤엉킨다. 뒤에 온 것만 돌린다.
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ghcr.io 리포지토리 이름은 반드시 소문자여야 한다.
      # github.repository는 대소문자를 그대로 가져오므로 여기서 변환해둔다.
      - id: image
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 이미지 빌드가 곧 검증이다 — Dockerfile의 `bun run build`가
      # prisma generate + next build(타입체크·ESLint 포함)를 돌린다.
      # 여기서 실패하면 이미지가 푸시되지 않으므로 깨진 코드는 배포되지 않는다.
      #
      # ⚠️ NEXT_PUBLIC_* 는 빌드 타임에 번들로 인라인된다. 여기서 안 넘기면
      #    빈 값으로 굳어 이미지가 플레이스홀더로 나간다(Dockerfile 주석 참고).
      #    시크릿은 넣지 않는다 — build arg는 이미지 히스토리에 남는다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.image.outputs.image }}:latest
          build-args: |
            NEXT_PUBLIC_ASSET_BASE_URL=${{ vars.NEXT_PUBLIC_ASSET_BASE_URL }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ vars.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 호스트 키를 미리 고정한다. StrictHostKeyChecking=no 로 두면
          # 중간자 공격을 감지하지 못한 채 배포 자격증명이 넘어간다.
          echo "${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 서버에는 소스를 두지 않는다. 실행에 필요한 파일만 올린다.
      - name: 구성 파일 전송
        run: |
          scp -i ~/.ssh/id_deploy \
            docker-compose.prod.yml Caddyfile \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/sullyuwha/"
          scp -i ~/.ssh/id_deploy \
            scripts/backup-db.sh scripts/restore-db.sh \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:/opt/sullyuwha/scripts/"

      - name: 배포
        env:
          TAG: ${{ needs.build.outputs.tag }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/id_deploy \
            "${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}" \
            "APP_IMAGE='${IMAGE}:${TAG}' bash -s" <<'REMOTE' | tee /tmp/deploy-out.log
          set -euo pipefail
          cd /opt/sullyuwha
          chmod +x scripts/*.sh

          # ── 배포 대상이 맞는지부터 본다 ──────────────────────────────
          # 이 검사가 없어서 실제로 한 번 크게 헤맸다 — LIGHTSAIL_HOST 가 도메인이
          # 가리키지 않는 인스턴스를 향하고 있었는데, 배포는 그쪽에서 멀쩡히 성공하고
          # 워크플로는 초록불이었다. 사이트만 며칠 전 코드 그대로였다.
          #
          # 앞에 CDN을 두게 되면 도메인은 더 이상 이 서버를 직접 가리키지 않는다.
          # 그때는 이 블록을 지우면 된다.
          echo "▸ 배포 대상 확인"
          DOMAIN_FIRST=$(grep -E '^DOMAIN=' .env.production | head -1 | cut -d= -f2- | cut -d, -f1 | tr -d ' "')
          MY_IP=$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')
          # getent hosts 는 환경에 따라 빈 값을 준다. 한 방법에만 기대면 조회가 실패했을 때
          # 검사가 조용히 통과해 버린다 — 실제로 그렇게 한 번 놓쳤다.
          DNS_IP=$(getent ahostsv4 "$DOMAIN_FIRST" 2>/dev/null | awk '{print $1}' | head -1)
          [ -z "$DNS_IP" ] && DNS_IP=$(dig +short A "$DOMAIN_FIRST" 2>/dev/null | grep -E '^[0-9.]+$' | tail -1)
          [ -z "$DNS_IP" ] && DNS_IP=$(getent hosts "$DOMAIN_FIRST" 2>/dev/null | awk '{print $1}' | head -1)

          # 결과를 항상 남긴다. 통과했을 때도 무엇과 무엇을 비교했는지 보여야
          # "초록불인데 사이트는 그대로"인 상황에서 로그만으로 판단할 수 있다.
          echo "  배포 대상 hostname = $(hostname)"
          echo "  배포 대상 공인 IP  = ${MY_IP}"
          echo "  ${DOMAIN_FIRST} → ${DNS_IP:-(조회 실패)}"

          if [ -z "$DNS_IP" ]; then
            echo "${DOMAIN_FIRST} 의 A 레코드를 조회하지 못해 배포 대상을 확인할 수 없습니다." >&2
            exit 1
          fi
          if [ "$MY_IP" != "$DNS_IP" ]; then
            echo "이 서버는 ${DOMAIN_FIRST} 이 가리키는 서버가 아닙니다." >&2
            echo "  LIGHTSAIL_HOST 시크릿 또는 DNS A 레코드를 맞추세요." >&2
            exit 1
          fi

          # ── 표준 호스트와 AUTH_URL 이 같은지 ────────────────────────
          # Caddy가 다른 호스트를 표준 호스트로 301 보내므로, AUTH_URL 이 다른
          # 호스트를 가리키면 로그인 후 그쪽으로 갔다가 다시 되돌아오면서
          # 쿠키를 읽지 못해 로그인 화면을 맴돈다. 컨테이너를 건드리기 전에 막는다.
          echo "▸ 표준 호스트 확인"
          CANON=$(grep -E '^CANONICAL_HOST=' .env.production | head -1 | cut -d= -f2- | tr -d ' "')
          [ -z "$CANON" ] && CANON="$DOMAIN_FIRST"
          AUTH_HOST=$(grep -E '^AUTH_URL=' .env.production | head -1 | cut -d= -f2- \
            | tr -d ' "' | sed -E 's#^https?://##; s#/.*$##')
          echo "  표준 호스트 = ${CANON}"
          echo "  AUTH_URL    = ${AUTH_HOST:-(없음)}"
          if [ "$AUTH_HOST" != "$CANON" ]; then
            echo "AUTH_URL 의 호스트가 표준 호스트와 다릅니다." >&2
            echo "  .env.production 의 AUTH_URL 을 https://${CANON} 로 맞추세요." >&2
            exit 1
          fi

          echo "▸ 이미지 받기: $APP_IMAGE"
          echo "${GHCR_TOKEN:-}" | docker login ghcr.io -u "${GHCR_USER:-}" --password-stdin 2>/dev/null || true
          docker pull "$APP_IMAGE"

          export APP_IMAGE
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"

          echo "▸ DB 기동 확인"
          $COMPOSE up -d postgres </dev/null
          # 마이그레이션 전에 DB가 실제로 받을 준비가 됐는지 본다.
          #
          # ⚠️ stdin을 반드시 막는다(`</dev/null`).
          #    이 스크립트는 `ssh ... "bash -s"` 의 **stdin으로 흘러들어온다.**
          #    docker compose 의 exec·run 은 stdin을 읽으므로, 막지 않으면
          #    남은 스크립트를 통째로 삼켜 버린다. 그러면 bash는 EOF를 만나
          #    **종료 코드 0으로 조용히 끝나고** 워크플로는 초록불이 된다.
          #    실제로 그렇게 마이그레이션·컨테이너 교체가 몇 주 동안 한 번도
          #    실행되지 않은 채 배포가 "성공"했다.
          for i in $(seq 1 30); do
            $COMPOSE exec -T postgres pg_isready -U sullyuwha </dev/null >/dev/null 2>&1 && break
            sleep 2
          done

          echo "▸ 마이그레이션"
          # 배포할 바로 그 이미지로 돌린다 — 코드와 스키마 버전이 어긋나지 않는다.
          $COMPOSE run --rm --no-deps app bunx prisma migrate deploy </dev/null

          echo "▸ 컨테이너 교체"
          $COMPOSE up -d --remove-orphans </dev/null

          # 정말 교체됐는지 확인한다.
          #
          # up -d 는 "바꿀 게 없다"고 판단하면 조용히 아무것도 안 한다. 그러면 아래
          # 헬스체크는 **옛 컨테이너**를 상대로 통과하고 배포는 초록불로 끝난다.
          # 실제로 그렇게 며칠 전 이미지가 계속 돌고 있었다.
          echo "▸ 교체 확인"
          RUNNING=$(docker inspect --format '{{.Config.Image}}' sullyuwha-app)
          if [ "$RUNNING" != "$APP_IMAGE" ]; then
            echo "컨테이너가 교체되지 않았습니다." >&2
            echo "  기대=${APP_IMAGE}" >&2
            echo "  실제=${RUNNING}" >&2
            exit 1
          fi

          echo "▸ 헬스체크"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:80/sull-admin/login; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "헬스체크 실패 — 최근 로그:" >&2
            $COMPOSE logs --tail=50 app >&2
            exit 1
          fi

          echo "▸ 자원 상태(정리 전)"
          df -h / | awk 'NR==2{print "  디스크: "$3" 사용 / "$2" (여유 "$4")"}'
          free -h | awk 'NR==2{print "  메모리: "$3" 사용 / "$2}'

          echo "▸ 오래된 이미지 정리"
          # `-a` 가 핵심이다.
          #
          # 없으면 **태그 없는(dangling) 이미지만** 지운다. 배포마다 받는
          # ghcr.io/...:<sha> 는 태그가 붙어 있어 해당되지 않으므로, 쓰지도 않는
          # 이미지가 배포할 때마다 1GB 넘게 계속 쌓인다. 작은 인스턴스에서는
          # 이것만으로 디스크가 찬다.
          #
          # 실행 중인 컨테이너가 쓰는 이미지는 -a 로도 지워지지 않으므로 안전하다.
          docker image prune -af --filter "until=168h" </dev/null >/dev/null

          # 그래도 빠듯하면 나이를 따지지 않고 미사용 이미지를 모두 지운다.
          # 롤백은 GHCR에서 다시 받으면 되므로 로컬 사본이 없어도 막히지 않는다.
          AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if [ "${AVAIL_GB:-99}" -lt 5 ]; then
            echo "  여유 ${AVAIL_GB}GB — 미사용 이미지를 모두 정리한다"
            docker image prune -af </dev/null >/dev/null
          fi

          echo "▸ 자원 상태(정리 후)"
          df -h / | awk 'NR==2{print "  디스크: "$3" 사용 / "$2" (여유 "$4")"}'

          echo "✅ 배포 완료: $APP_IMAGE"
          REMOTE

          # 원격 스크립트가 **끝까지** 실행됐는지 확인한다.
          #
          # 위 스크립트는 ssh의 stdin으로 흘러들어가므로, 중간에 stdin을 읽는 명령이
          # 하나라도 있으면 나머지를 삼키고 bash가 EOF로 조용히 끝난다 — 종료 코드는 0이라
          # ssh도 워크플로도 성공으로 본다. `</dev/null` 로 막아 뒀지만, 앞으로 이 스크립트에
          # 명령을 추가하다 같은 실수를 반복할 수 있다. 마지막 줄이 실제로 찍혔는지 본다.
          if ! grep -q "✅ 배포 완료" /tmp/deploy-out.log; then
            echo "원격 스크립트가 끝까지 실행되지 않았습니다." >&2
            echo "  stdin을 읽는 명령(docker compose exec/run 등)이 남은 스크립트를" >&2
            echo "  삼켰을 가능성이 높습니다. 해당 명령에 '</dev/null' 을 붙이세요." >&2
            exit 1
          fi
        # GHCR이 비공개면 서버도 로그인이 필요하다.
        # 서버의 .env.production 에 GHCR_USER/GHCR_TOKEN 을 넣어 두면 위 login이 쓴다.
